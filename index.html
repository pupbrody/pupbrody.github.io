<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;margin:0;background:#171717;color:#e5e7eb;color-scheme:dark}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:24px;margin:8px 0 4px}
.sub{color:#9ca3af;font-size:14px;margin:0 0 16px}
.card{background:#262626;border:1px solid #404040;border-radius:14px;padding:16px;margin-bottom:14px}
label{font-size:13px;color:#9ca3af}
select{font-size:16px;padding:8px 10px;border-radius:10px;border:1px solid #404040;background:#262626;color:#e5e7eb;margin:6px 0 12px}
.months{display:flex;flex-wrap:wrap;gap:6px}
.months button{border:1px solid #404040;background:#262626;color:#e5e7eb;border-radius:999px;padding:7px 11px;cursor:pointer}
.months button.on{background:#e5e7eb;color:#111827;border-color:#e5e7eb}
.months button.has{font-weight:700}
.grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:102px;align-items:stretch;gap:6px;margin-top:12px}
.dow{text-align:center;font-size:12px;color:#9ca3af;padding:4px 0}
.dow:nth-child(1){color:#f87171}.dow:nth-child(7){color:#60a5fa}
.cell{height:102px;min-height:102px;box-sizing:border-box;border:1px solid #404040;border-radius:10px;padding:6px;text-align:left;background:#262626;color:#e5e7eb;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start}
.cell.today{border:2px solid #ef4444}
.cell.sel{background:#3f3f46;border-color:#a1a1aa}
.cell.rest{background:#4a4417;border-color:#a16207}
.cell.rest.sel{background:#57501f;border-color:#eab308}
#scheduleImg{width:100%;margin-top:12px;border:1px solid #404040;border-radius:10px;display:none;background:#fff}
.cell .d{font-size:14px;font-weight:700;color:#f9fafb;line-height:20px;height:20px;flex:0 0 20px}

let year = 2026, month = 11, selected = "2026-11-01";
const dows = ["일","월","화","수","목","금","토"];
function pad(n){return String(n).padStart(2,"0")}
function key(y,m,d){return y+"-"+pad(m)+"-"+pad(d)}
function renderMonths(){
  const el=document.getElementById("months"); el.innerHTML="";
  for(let m=1;m<=12;m++){
    const b=document.createElement("button");
    const has=Object.keys(SCHEDULE).some(k=>k.startsWith(year+"-"+pad(m)));
    b.textContent=m+"월"; if(m===month)b.classList.add("on"); if(has)b.classList.add("has");
    b.onclick=()=>{month=m; renderMonths(); renderGrid();};
    el.appendChild(b);
  }
}
function showDetail(k){
  selected=k; const e=SCHEDULE[k];
  const dt=new Date(k+"T00:00:00");
  const head=k+" ("+dows[dt.getDay()]+")";
  const el=document.getElementById("detail");
  const img=document.getElementById("scheduleImg");
  const ym=k.slice(0,7);
  const hasMonthData=Object.keys(SCHEDULE).some(x=>x.startsWith(ym));
  if(img){
    if(ROUTE_IMAGES[k]){
      img.src=ROUTE_IMAGES[k]; img.style.display="block";
    } else { img.style.display="none"; img.removeAttribute("src"); }
  }
  if(!e){
    el.innerHTML="<b>"+head+"</b><br>"+(hasMonthData?"비번입니다.":"등록된 근무가 없습니다.");
    document.querySelectorAll(".cell").forEach(c=>c.classList.toggle("sel", c.dataset.key===k));
    return;
  }
  let html="<b>"+head+"</b><br>";
  if(e.type==="휴가") html+="휴가입니다.<br>";
  html+="근무: "+e.type+" ("+e.detail+")<br>";
  if(e.dia) html+="근무번호(DIA): "+e.dia+"<br>";
  if(e.dia) html+="행로표: "+e.detail+" "+e.dia+"번<br>";
  if(e.start) html+="출근: "+e.start+"<br>";
  if(e.end) html+="퇴근: "+e.end+"<br>";
  if(e.leave) html+="휴가: "+e.leave+"<br>";
  el.innerHTML=html;
  document.querySelectorAll(".cell").forEach(c=>c.classList.toggle("sel", c.dataset.key===k));
}
function renderGrid(){
  document.getElementById("title").textContent=year+"년 "+month+"월";
  const grid=document.getElementById("grid"); grid.innerHTML="";
  dows.forEach(d=>{const s=document.createElement("div"); s.className="dow"; s.textContent=d; grid.appendChild(s);});
  const first=new Date(year,month-1,1).getDay();
  const days=new Date(year,month,0).getDate();
  for(let i=0;i<first;i++){const s=document.createElement("div"); grid.appendChild(s);}
  const todayKey=new Date().getFullYear()+"-"+pad(new Date().getMonth()+1)+"-"+pad(new Date().getDate());
  const hasMonthData=Object.keys(SCHEDULE).some(x=>x.startsWith(year+"-"+pad(month)));
  for(let d=1;d<=days;d++){
    const k=key(year,month,d); const e=SCHEDULE[k];
    const c=document.createElement("div"); c.setAttribute("role","button"); c.tabIndex=0; c.className="cell"; c.dataset.key=k;
    const wd=new Date(year,month-1,d).getDay(); if(wd===0)c.classList.add("sun"); if(wd===6)c.classList.add("sat");
    const isRest=hasMonthData && (!e || e.type==="휴가");
    if(isRest)c.classList.add("rest");
    if(k===todayKey)c.classList.add("today"); if(k===selected)c.classList.add("sel");
    let inner='<div class="d">'+d+'</div>';
    if(e){
      const cls=e.type==="주간"?"day":e.type==="야간"?"night":"leave";
      inner+='<span class="tag '+cls+'">'+e.type+'</span><div class="t">';
      if(e.leave) inner+=e.leave;
      else inner+=(e.dia?e.dia+"dia<br>":"")+"출 "+e.start+"<br>퇴 "+e.end;
      inner+='</div>';
    } else if(hasMonthData){
      inner+='<span class="tag" style="visibility:hidden">비번</span><div class="t">비번</div>';
    } else {
      inner+='<span class="tag" style="visibility:hidden">-</span><div class="t" style="visibility:hidden">-</div>';
    }
    c.innerHTML=inner; c.onclick=()=>showDetail(k); grid.appendChild(c);
  }
}
renderMonths(); renderGrid(); showDetail(selected);
</script>
